<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda — Medifix</title>
  <meta name="description" content="Equipamiento médico, insumos y tecnología para clínicas y hospitales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">Medifix<span class="brand-dot">.</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="tienda.html" class="active">Tienda</a>
      <a href="cursos.html">Cursos</a>
      <a href="telemedicina.html">Telemedicina</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero hero-short">
    <div class="hero-inner">
      <h1>Cotizar equipo</h1>
      <p class="hero-sub">Organizado por especialidad, para que encuentres justo lo que tu área necesita. Cotiza directo por WhatsApp — sin cuenta ni carrito.</p>
    </div>
  </section>

  <section class="section">
    <div class="filter-row" data-target="productGrid" data-attr="data-category" id="filterRow"></div>
    <div class="product-grid" id="productGrid"></div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <p>&copy; 2026 Medifix. Todos los derechos reservados.</p>
  </div>
</footer>

<script>
// ============================================================
// CARGAR PRODUCTOS DESDE products.json
// ============================================================
const productGrid = document.getElementById('productGrid');
const filterRow = document.getElementById('filterRow');

function renderProducts(products, categories) {
  if (!products || products.length === 0) {
    productGrid.innerHTML = `
      <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#8A968F;">
        <p style="font-size:1.2rem;">🛒 No hay productos disponibles</p>
        <p style="font-size:0.95rem;">Agrega productos desde el panel de administración.</p>
        <a href="admin.html" class="btn btn-copper" style="margin-top:20px; display:inline-block;">Ir al admin</a>
      </div>
    `;
    return;
  }

  // Generar filtros
  filterRow.innerHTML = `<button class="filter-chip active" data-filter="todos">Todos</button>` +
    categories.map(c => `<button class="filter-chip" data-filter="${c.id}">${c.label}</button>`).join('');

  // Generar productos
  productGrid.innerHTML = products.map(p => {
    const catLabels = p.categories && p.categories.length > 0 
      ? p.categories.map(id => (categories.find(c => c.id === id) || {}).label || id).join(' · ')
      : 'Sin categoría';
    
    const price = p.price && p.price.trim() !== '' ? p.price : 'Consultar precio';
    const imgUrl = p.img && p.img.trim() !== '' ? p.img : 'https://placehold.co/600x600/f5f6f5/0B3049?text=Medifix';
    
    return `
      <article class="product-card" data-category="${p.categories ? p.categories.join(' ') : ''}" 
               data-preview="${imgUrl}" data-preview-tag="Cotizar" data-href="#">
        <div class="product-img" style="background-image:url('${imgUrl}'); background-size:contain; background-position:center; background-repeat:no-repeat;"></div>
        <div class="product-body">
          <span class="product-cat">${catLabels}</span>
          <h3>${p.name || 'Producto'}</h3>
          <p class="product-desc">${p.desc || ''}</p>
          <span class="product-price">${price}</span>
          <button class="btn btn-outline-dark btn-small product-cta" data-product="${p.name || 'Producto'}">Cotizar</button>
        </div>
      </article>
    `;
  }).join('');
}

// Cargar productos desde products.json
function loadProducts() {
  productGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:#8A968F;">
    <p>🔄 Cargando productos...</p>
  </div>`;

  fetch('products.json')
    .then(response => {
      if (!response.ok) throw new Error('No se pudo cargar products.json');
      return response.json();
    })
    .then(data => {
      renderProducts(data.products, data.categories);
      console.log('✅ Productos cargados desde products.json');
    })
    .catch(error => {
      console.error('Error cargando products.json:', error);
      productGrid.innerHTML = `
        <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#8A968F;">
          <p style="font-size:1.2rem;">⚠️ Error al cargar productos</p>
          <p style="font-size:0.95rem;">Verifica que el archivo products.json exista en la raíz del sitio.</p>
        </div>
      `;
    });
}

// Cargar productos al iniciar
loadProducts();

// ============================================================
// MENÚ MÓVIL
// ============================================================
const navToggle = document.getElementById('navToggle');
const navLinksEl = document.querySelector('.nav-links');
if (navToggle && navLinksEl) {
  navToggle.addEventListener('click', () => {
    const isOpen = navLinksEl.classList.toggle('is-open');
    navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    navToggle.classList.toggle('is-active', isOpen);
  });
  navLinksEl.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      navLinksEl.classList.remove('is-open');
      navToggle.classList.remove('is-active');
    });
  });
}

// ============================================================
// FILTROS
// ============================================================
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  const row = chip.closest('.filter-row');
  if (!row) return;
  const container = document.getElementById(row.dataset.target);
  const attr = row.dataset.attr;
  if (!container || !attr) return;

  row.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  const filter = chip.getAttribute('data-filter');

  Array.from(container.children).forEach(card => {
    const value = card.getAttribute(attr) || '';
    const show = filter === 'todos' || value.split(' ').includes(filter);
    card.style.display = show ? '' : 'none';
  });
});

// ============================================================
// COTIZAR POR WHATSAPP
// ============================================================
const WHATSAPP_NUMBER = "528718336666";

document.addEventListener('click', (e) => {
  const quoteBtn = e.target.closest('.product-cta');
  if (quoteBtn) {
    const product = quoteBtn.getAttribute('data-product');
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`Hola Medifix, quiero cotizar: ${product}`)}`, '_blank');
    return;
  }
});

// ============================================================
// VISTA PREVIA FLOTANTE
// ============================================================
(function initHoverPreview() {
  if (!window.matchMedia('(hover: hover)').matches) return;
  
  const preview = document.createElement('div');
  preview.className = 'hover-preview';
  preview.innerHTML = `<img alt="" style="display:none">
                        <span class="hover-preview-tag" style="display:none"></span>`;
  document.body.appendChild(preview);
  const imgEl = preview.querySelector('img');
  const tagEl = preview.querySelector('.hover-preview-tag');
  let activeEl = null;

  document.addEventListener('mousemove', (e) => {
    preview.style.left = e.clientX + 'px';
    preview.style.top = e.clientY + 'px';

    const target = e.target.closest('[data-preview]');
    if (target === activeEl) return;
    activeEl = target;

    if (!target) {
      preview.classList.remove('is-visible');
      return;
    }

    const imgSrc = target.getAttribute('data-preview');
    const tag = target.getAttribute('data-preview-tag');

    if (imgSrc && imgSrc !== '') {
      imgEl.src = imgSrc;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
    }

    if (tag) { tagEl.textContent = tag; tagEl.style.display = 'block'; }
    else { tagEl.style.display = 'none'; }

    preview.classList.add('is-visible');
  });

  document.addEventListener('mouseleave', () => {
    preview.classList.remove('is-visible');
    activeEl = null;
  });
})();
</script>

</body>
</html>
